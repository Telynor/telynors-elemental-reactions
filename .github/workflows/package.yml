name: Package Foundry Module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest main branch build should publish the rolling release.
concurrency:
  group: elemental-reactions-rolling-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module JavaScript and automation tests
        run: |
          for file in scripts/*.js; do
            node --input-type=module --check < "$file"
          done
          node --test tests/*.test.mjs
      - name: Build Foundry-ready ZIP
        run: |
          rm -f telynors-elemental-reactions.zip
          zip -r telynors-elemental-reactions.zip module.json scripts styles templates -x "*.DS_Store"
          # Fail the build if any of the app window templates are missing.
          for file in templates/directory.hbs templates/gm-panel.hbs templates/manager.hbs templates/element-editor.hbs templates/reaction-wizard.hbs templates/character-element.hbs templates/reaction-builder.hbs scripts/automation.js scripts/reaction-builder.js scripts/manual-damage.js; do
            unzip -Z1 telynors-elemental-reactions.zip | grep -Fxq "$file" || { echo "Missing package file: $file"; exit 1; }
          done
          unzip -Z1 telynors-elemental-reactions.zip | grep -Fxq "module.json"
          unzip -Z1 telynors-elemental-reactions.zip | grep -Fxq "scripts/main.js"
      - name: Publish rolling package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          prerelease: true
          files: telynors-elemental-reactions.zip
